name: "Exercice 2 - Production d'un artefact"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build et Sauvegarde de l'artefact"
    runs-on: ubuntu-latest
    steps:
      - name: "Récupérer le code source"
        uses: actions/checkout@v7

      - name: "Installer l'environnement Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: "Installer les dépendances"
        run: npm ci

      - name: "Compiler l'application"
        run: npm run build

      - name: "Vérifier la présence du livrable dans dist/"
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::Le build n'a produit aucun fichier dans dist/"
            exit 1
          fi

      - name: "Sauvegarder dist/ comme artefact"
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

      - name: "Générer le résumé du build"
        if: always()
        run: |
          echo "## Résumé du build" >> "$GITHUB_STEP_SUMMARY"
          echo "Déclencheur : ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Statut : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "dist" ]; then
            echo "### Contenu de dist/ :" >> "$GITHUB_STEP_SUMMARY"
            ls -la dist >> "$GITHUB_STEP_SUMMARY"
          fi
